apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server
  namespace: unstructured-controller-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server-role
  namespace: unstructured-controller-namespace
rules:
- apiGroups:
  - operator.dataverse.redhat.com
  resources:
  - unstructureddatapipelines
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server-rolebinding
  namespace: unstructured-controller-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unstructured-data-mcp-server-role
subjects:
- kind: ServiceAccount
  name: unstructured-data-mcp-server
  namespace: unstructured-controller-namespace
---
apiVersion: v1
data:
  MCP_SERVER_PORT: "8080"
  SNOWFLAKE_ACCOUNT: <YOUR_SNOWFLAKE_ACCOUNT>
  SSO_AUTHORIZATION_URL: <SSO_AUTHORIZATION_URL>
  SSO_CALLBACK_URL: <SSO_CALLBACK_URL>
  SSO_DISABLE_INTROSPECTION: "true"
  SSO_INTROSPECTION_URL: <SSO_INTROSPECTION_URL>
  SSO_TOKEN_URL: <SSO_TOKEN_URL>
kind: ConfigMap
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server-config
  namespace: unstructured-controller-namespace
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server-secret
  namespace: unstructured-controller-namespace
stringData:
  EMBEDDING_API_KEY: REPLACE_WITH_YOUR_EMBEDDING_API_KEY
  EMBEDDING_ENDPOINT: REPLACE_WITH_YOUR_EMBEDDING_ENDPOINT
  EMBEDDING_MODEL_NAME: REPLACE_WITH_YOUR_EMBEDDING_MODEL_NAME
  SSO_CLIENT_ID: REPLACE_WITH_YOUR_CLIENT_ID
  SSO_CLIENT_SECRET: REPLACE_WITH_YOUR_CLIENT_SECRET
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: unstructured-data-mcp-server
  name: unstructured-data-mcp-server
  namespace: unstructured-controller-namespace
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: unstructured-data-mcp-server
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unstructured-data-mcp-server
    component: unstructured-data-mcp-server
  name: unstructured-data-mcp-server
  namespace: unstructured-controller-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unstructured-data-mcp-server
  template:
    metadata:
      labels:
        app: unstructured-data-mcp-server
    spec:
      containers:
      - env:
        - name: UNSTRUCTURED_DATA_CONTROLLER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: unstructured-data-mcp-server-config
        - secretRef:
            name: unstructured-data-mcp-server-secret
        image: ghcr.io/redhat-data-and-ai/unstructured-data-controller-mcp-server:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        name: unstructured-data-mcp-server
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/pki/ca-trust/source/anchors
          name: custom-ca-certs
          readOnly: true
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: unstructured-data-mcp-server
      volumes:
      - configMap:
          name: custom-ca-certs
          optional: true
        name: custom-ca-certs
